<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raíz Viva · Arbolado urbano de Colombia</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--g:#1f7a4d;--g2:#0f4d33;--b:#0b5394;--au:#c9a227;--bg:#f4f8f5;--card:#fff;--tx:#12261c;--mu:#5a6c62;--bd:#dde7e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0 0 8px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:linear-gradient(90deg,var(--g2),var(--b));color:#fff;border-bottom:3px solid var(--au)}
header b{font:700 22px Fraunces,Georgia,serif;margin-right:auto}
header nav{display:flex;gap:6px;flex-wrap:wrap}
header button{border:0;border-radius:9px;padding:8px 13px;font:600 14px inherit;font-family:inherit;cursor:pointer;background:rgba(255,255,255,.16);color:#fff}
header button.on{background:#fff;color:var(--g2)}
#vMapa{display:grid;grid-template-columns:1fr 390px;height:calc(100dvh - 62px)}
#mapw{position:relative}#map{position:absolute;inset:0}
#panel{overflow:auto;padding:14px;background:var(--bg)}
@media(max-width:820px){#vMapa{grid-template-columns:1fr;grid-template-rows:55dvh 1fr;height:auto}}
.tb{position:absolute;z-index:500;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font:700 14px inherit;font-family:inherit;cursor:pointer;background:var(--g);color:#fff}
.btn.b{background:var(--b)}.btn.o{background:#fff;color:var(--g);border:1px solid var(--g)}.btn.r{background:#c0392b}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--au);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;font:inherit;background:#fff;color:var(--tx)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx);margin:6px 0}.ck input{width:auto}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:10px 0}.dl span{display:block;font-size:12px;color:var(--mu)}
.fotos{display:flex;gap:6px;overflow:auto;margin:8px 0}.fotos img{height:90px;border-radius:9px}
.lst button{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;border-bottom:1px solid var(--bd);background:none;padding:9px 2px;font:inherit;color:var(--tx);cursor:pointer;text-align:left}
.gd{display:flex;align-items:center;gap:12px;border-top:2px solid var(--au);padding-top:10px;margin-top:10px}
.dist{font:700 30px Fraunces,Georgia,serif;color:var(--b)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
section.v{padding:18px 16px;max-width:1000px;margin:auto}.hide{display:none!important}
#vDash,#vImp,#vRep{max-width:1200px}.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.ch{height:260px;position:relative}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{margin:0}.kpi b{display:block;font:700 26px Fraunces,Georgia,serif;color:var(--g)}.kpi span{font-size:12px;color:var(--mu)}.dash{display:grid;grid-template-columns:220px 1fr;gap:14px}@media(max-width:820px){.dash{grid-template-columns:1fr}}details summary{cursor:pointer;font-weight:700;color:var(--b)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.md{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:560px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--g2);color:#fff;padding:10px 16px;border-radius:10px;z-index:3000;display:none;max-width:90%}
</style>
</head>
<body>
<header><b>Raíz Viva</b><nav id="nav"></nav><button id="auth"></button></header>
<main>
<section id="vMapa"><div id="mapw"><div id="map"></div><div class="tb" id="tb"></div></div><div id="panel"></div></section>
<section id="vUsr" class="v hide"></section>
<section id="vRol" class="v hide"></section>
<section id="vCam" class="v hide"></section>
<section id="vCar" class="v hide"></section>
<section id="vDash" class="v hide"></section>
<section id="vImp" class="v hide"></section>
<section id="vRep" class="v hide"></section>
</main>
<div id="toast" role="status"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
/* ===== CONFIGURACIÓN: pega aquí los datos de tu proyecto Supabase ===== */
const SUPABASE_URL="https://longchzjshpxldxrkpoy.supabase.co", SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvbmdjaHpqc2hweGxkeHJrcG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NjY3MzMsImV4cCI6MjEwODU0MjczM30.oN40gCsWSGRDRTD8h4ZpC9c7g34pc6o4eTB4mlXIeiE";
/* Mapa satélite. Para uso comercial a gran escala, cambia esta URL por la de un proveedor con plan (MapTiler, Mapbox). */

const SAT={url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",attr:"Imágenes © Esri"};
const PERMS={crear_arbol:"Registrar árboles",editar_arbol:"Editar árboles",eliminar_arbol:"Eliminar árboles",subir_fotos:"Subir fotografías",ver_informes:"Ver informes técnicos",crear_informe:"Redactar informes técnicos",gestionar_usuarios:"Crear y administrar usuarios",gestionar_roles:"Crear roles y asignar funciones",carga_masiva:"Carga masiva y exportación a Excel",gestionar_campos:"Administrar campos del formulario",ver_dashboard:"Ver el dashboard",configurar_dashboard:"Elegir qué se muestra en el dashboard",ver_impacto:"Ver impacto ambiental (cálculos UPME)",ver_reportes:"Descargar reportes por fecha"};
const ES=["Excelente","Bueno","Regular","Crítico"],EC=["#1f9d55","#86b93c","#e3a519","#d64545"],RK=["Bajo","Medio","Alto"];

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let CAMPOS=[],UL=[],RL=[],prof=null,T=[],sel=null,me=null,gpsId=null,q="",markers={},meLay=null,line=null,view="mapa";
const can=p=>!!(prof&&prof.activo&&prof.roles&&(prof.roles.es_global||prof.roles.permisos.includes(p)));
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",4000)}
function modal(h){closeM();const o=document.createElement("div");o.className="ov";o.id="ov";o.innerHTML='<div class="md">'+h+'</div>';o.onclick=e=>{if(e.target===o)closeM()};document.body.appendChild(o)}
function closeM(){const o=$("#ov");if(o)o.remove()}

/* ===== MAPA ===== */
const map=L.map("map",{zoomControl:false}).setView([1.2136,-77.2811],14);
const sat=L.tileLayer(SAT.url,{maxZoom:19,attribution:SAT.attr}).addTo(map);
const calles=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"});
L.control.layers({"Satélite":sat,"Calles":calles},null,{position:"topright"}).addTo(map);
L.control.zoom({position:"bottomright"}).addTo(map);
async function loadTrees(){let data=[],from=0;for(;;){const r=await sb.from("arboles").select("*").order("id").range(from,from+999);if(r.error){toast("No se pudo cargar el inventario: "+r.error.message);return}data=data.concat(r.data);if(r.data.length<1000)break;from+=1000}
T=data;if(sel)sel=T.find(t=>t.id===sel.id)||null;drawMarkers();panel();if(T.length&&!loadTrees.f){map.fitBounds(T.map(t=>[t.latitud,t.longitud]),{padding:[40,40],maxZoom:17});loadTrees.f=1}
if(!loadTrees.d){loadTrees.d=1;const c=new URLSearchParams(location.search).get("arbol"),t=c&&T.find(x=>x.codigo===c);if(t){pick(t.id);map.setView([t.latitud,t.longitud],19);setTimeout(()=>$("#panel").scrollIntoView({behavior:"smooth"}),300)}}}
function drawMarkers(){Object.values(markers).forEach(m=>m.remove());markers={};
T.filter(match).forEach(t=>{const i=Math.max(0,ES.indexOf(t.estado_general)),on=sel&&sel.id===t.id;
markers[t.id]=L.circleMarker([t.latitud,t.longitud],{radius:on?12:9,fillColor:EC[i],color:on?"#c9a227":"#fff",weight:on?4:2,fillOpacity:.95}).addTo(map).bindTooltip((t.nombre_comun||t.codigo)+(t.responsable?" · "+t.responsable:"")).on("click",()=>pick(t.id))})}
const match=t=>((t.codigo||"")+(t.nombre_comun||"")).toLowerCase().includes(q.toLowerCase());
function pick(id){sel=T.find(t=>t.id===id);drawMarkers();panel();if(sel)map.panTo([sel.latitud,sel.longitud]);if(line){line.remove();line=null}}

/* ===== GPS ===== */
function startGPS(center){if(!navigator.geolocation){toast("Este dispositivo no tiene GPS disponible.");return}
if(gpsId!==null){if(me&&center)map.setView([me.lat,me.lng],18);return}
toast("Buscando tu ubicación…");let first=center;
gpsId=navigator.geolocation.watchPosition(p=>{me={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
if(!meLay)meLay={c:L.circle([me.lat,me.lng],{radius:me.acc,color:"#0b5394",weight:1,fillOpacity:.1}).addTo(map),m:L.circleMarker([me.lat,me.lng],{radius:8,fillColor:"#0b5394",color:"#fff",weight:3,fillOpacity:1}).addTo(map)};
meLay.c.setLatLng([me.lat,me.lng]).setRadius(me.acc);meLay.m.setLatLng([me.lat,me.lng]);
if(first){map.setView([me.lat,me.lng],18);first=false}guide()},
()=>{gpsId=null;toast("No se pudo obtener tu ubicación. Activa el permiso de ubicación del navegador (se requiere HTTPS).")},
{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}
function brg(a,b){const r=x=>x*Math.PI/180,y=Math.sin(r(b[1]-a[1]))*Math.cos(r(b[0])),x=Math.cos(r(a[0]))*Math.sin(r(b[0]))-Math.sin(r(a[0]))*Math.cos(r(b[0]))*Math.cos(r(b[1]-a[1]));return(Math.atan2(y,x)*180/Math.PI+360)%360}
function guide(){const g=$("#gd");if(!g||!sel||!me)return;const a=[me.lat,me.lng],t=[sel.latitud,sel.longitud],d=map.distance(a,t),b=brg(a,t),N=["norte","noreste","este","sureste","sur","suroeste","oeste","noroeste"][Math.round(b/45)%8];
g.innerHTML='<div class="gd"><svg width="58" height="58" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="none" stroke="#dde7e0" stroke-width="2"/><g transform="rotate('+b+' 32 32)"><path d="M32 8l11 30-11-6-11 6z" fill="#c9a227"/></g></svg><div><div class="dist">'+(d<1000?Math.round(d)+" m":(d/1000).toFixed(1)+" km")+'</div><small>'+(d<8?"Has llegado al árbol":"Camina hacia el "+N+" · precisión "+Math.round(me.acc)+" m")+'</small></div></div>';
if(line)line.setLatLngs([a,t])}
function guiar(){startGPS(false);if(line)line.remove();line=L.polyline([],{color:"#c9a227",weight:4,dashArray:"8 8"}).addTo(map);if(me){guide();map.fitBounds([[me.lat,me.lng],[sel.latitud,sel.longitud]],{padding:[60,60]})}else toast("Activando GPS… la guía aparecerá al obtener tu ubicación.")}

/* ===== PANEL ===== */
function panel(){const p=$("#panel");
$("#tb").innerHTML='<button class="btn" id="bme">Mi ubicación</button>'+(can("crear_arbol")?'<button class="btn b" id="bnew">+ Árbol</button>':"");
$("#bme").onclick=()=>startGPS(true);if($("#bnew"))$("#bnew").onclick=()=>treeForm(null);
if(!sel){p.innerHTML='<h2>Arbolado</h2><input id="q" type="search" placeholder="Buscar por código o nombre" value="'+esc(q)+'"><div class="lst card" style="margin-top:10px">'+(T.filter(match).map(t=>'<button data-i="'+t.id+'"><span><b>'+esc(t.nombre_comun||"Sin nombre")+'</b> <small>'+esc(t.codigo)+(t.responsable?' · '+esc(t.responsable):'')+'</small></span><span class="badge" style="background:'+EC[Math.max(0,ES.indexOf(t.estado_general))]+'">'+esc(t.estado_general)+'</span></button>').join("")||"<p>Aún no hay árboles registrados.</p>")+'</div>';
$("#q").oninput=e=>{q=e.target.value;const c=e.target.selectionStart;panel();drawMarkers();const n=$("#q");n.focus();n.setSelectionRange(c,c)};
p.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>pick(+b.dataset.i));return}
const t=sel,i=Math.max(0,ES.indexOf(t.estado_general));
p.innerHTML='<button class="btn o" id="back">← Volver al listado</button><div class="card" style="margin-top:10px"><div style="display:flex;justify-content:space-between;gap:8px"><div><h2>'+esc(t.nombre_comun||"Sin nombre")+'</h2><i>'+esc(t.nombre_cientifico||"")+'</i></div><span class="badge" style="background:'+EC[i]+';height:fit-content">'+esc(t.estado_general)+'</span></div>'
+((t.fotos||[]).length?'<div class="fotos">'+t.fotos.map(u=>'<img src="'+esc(u)+'" alt="Foto del árbol" loading="lazy">').join("")+'</div>':"")
+'<div class="dl"><div><span>Código</span><b>'+esc(t.codigo)+'</b></div><div><span>Origen</span><b>'+esc(t.origen)+'</b></div><div><span>DAP</span><b>'+(t.dap??"—")+' cm</b></div><div><span>Altura</span><b>'+(t.altura_total??"—")+' m</b></div><div><span>Riesgo volcamiento</span><b>'+esc(t.riesgo_volcamiento)+'</b></div><div><span>Riesgo caída de ramas</span><b>'+esc(t.riesgo_caida_ramas)+'</b></div><div><span>Manejo</span><b>'+esc(t.manejo_propuesto||"—")+'</b></div><div><span>Prioridad</span><b>'+esc(t.priorizacion)+'</b></div><div><span>Ubicación</span><b>'+esc([t.direccion,t.barrio].filter(Boolean).join(", ")||"—")+'</b></div><div><span>Registrado por</span><b>'+esc(t.responsable||"—")+'</b></div><div><span>Fecha de inventario</span><b>'+esc(t.fecha_inventario||"—")+'</b></div>'+(t.actualizado_por?'<div><span>Última edición</span><b>'+esc(t.actualizado_por)+'</b></div>':"")+Object.entries(t.datos_extra||{}).filter(([k,x])=>x!==""&&x!=null).map(([k,x])=>'<div><span>'+esc(k)+'</span><b>'+esc(x)+'</b></div>').join("")+'</div>'
+'<div id="gd"></div><div class="acts"><button class="btn" id="bg">Guiarme hasta aquí</button><button class="btn o" id="bgm">Cómo llegar</button>'
+(can("ver_informes")||can("crear_informe")?'<button class="btn b" id="bin">Informe técnico</button>':"")+(can("editar_arbol")?'<button class="btn o" id="bed">Editar</button>':"")+(can("crear_arbol")||can("editar_arbol")?'<button class="btn o" id="bqr">Código QR</button>':"")+(can("eliminar_arbol")?'<button class="btn r" id="bde">Eliminar</button>':"")+'</div></div>';
$("#back").onclick=()=>{sel=null;if(line){line.remove();line=null}drawMarkers();panel()};$("#bg").onclick=guiar;
$("#bgm").onclick=()=>window.open("https://www.google.com/maps/dir/?api=1&destination="+t.latitud+","+t.longitud+"&travelmode=walking","_blank");
if($("#bin"))$("#bin").onclick=informe;if($("#bed"))$("#bed").onclick=()=>treeForm(t);if($("#bqr"))$("#bqr").onclick=()=>qrModal(t);
if($("#bde"))$("#bde").onclick=async()=>{if(!confirm("¿Eliminar el árbol "+t.codigo+"? No se puede deshacer."))return;const {error}=await sb.from("arboles").delete().eq("id",t.id);if(error)return toast(error.message);sel=null;toast("Árbol eliminado");loadTrees()};
guide()}

/* ===== FORMULARIOS ===== */
const fl=(n,l,v,ty)=>'<div><label for="f_'+n+'">'+l+'</label><input id="f_'+n+'" name="'+n+'" type="'+(ty||"text")+'" '+(ty==="number"?'step="any" ':"")+'value="'+esc(v)+'"></div>';
const sl=(n,l,o,v)=>'<div><label for="f_'+n+'">'+l+'</label><select id="f_'+n+'" name="'+n+'">'+o.map(x=>'<option'+(x===v?" selected":"")+'>'+x+'</option>').join("")+'</select></div>';
const BC={nombre_comun:["t"],nombre_cientifico:["t"],familia:["t"],origen:["l",["Nativo","Introducido","Endémico"]],altura_total:["n"],dap:["n"],estado_general:["l",ES],riesgo_volcamiento:["l",RK],riesgo_caida_ramas:["l",RK],manejo_propuesto:["t"],priorizacion:["l",["Baja","Media","Alta"]],direccion:["t"],barrio:["t"],comuna:["t"]};
function treeForm(t){const v=t||{},act=CAMPOS.filter(c=>c.activo).sort((a,b)=>(a.orden||999)-(b.orden||999));let last="",h="";
act.forEach(c=>{const cat=c.categoria||"Personalizados";if(cat!==last){h+='<h3 style="grid-column:1/-1;margin:14px 0 0;font-size:16px;color:var(--g)">'+esc(cat)+'</h3>';last=cat}
const b=c.columna&&BC[c.columna];h+=b?(b[0]==="l"?sl(c.columna,esc(c.etiqueta),b[1],v[c.columna]):fl(c.columna,esc(c.etiqueta),v[c.columna],b[0]==="n"?"number":"text")):xf(c,(v.datos_extra||{})[c.etiqueta])});
modal('<h2>'+(t?"Editar árbol":"Registrar árbol")+'</h2><form id="ft"><div class="g2">'+fl("codigo","Código *",v.codigo)+'<div></div>'+fl("latitud","Latitud *",v.latitud,"number")+fl("longitud","Longitud *",v.longitud,"number")+'</div>'
+'<div class="acts"><button type="button" class="btn o" id="ugps">Usar mi GPS</button><button type="button" class="btn o" id="ucen">Usar centro del mapa</button></div><div class="g2">'+h+'</div>'
+(can("subir_fotos")?'<label for="f_fotos">Fotografías (puedes tomar o elegir varias)</label><input id="f_fotos" name="fotos" type="file" accept="image/*" multiple>':"")
+'<div class="acts"><button class="btn" type="submit">Guardar</button><button type="button" class="btn o" id="cx">Cancelar</button></div></form>');
const f=$("#ft");$("#cx").onclick=closeM;
$("#ugps").onclick=()=>{if(!me){startGPS(false);return toast("Activando GPS, vuelve a pulsar en unos segundos.")}f.latitud.value=me.lat.toFixed(7);f.longitud.value=me.lng.toFixed(7)};
$("#ucen").onclick=()=>{const c=map.getCenter();f.latitud.value=c.lat.toFixed(7);f.longitud.value=c.lng.toFixed(7)};
f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f),o={codigo:(d.get("codigo")||"").trim()};
["latitud","longitud"].forEach(k=>o[k]=d.get(k)===""?null:+d.get(k));
act.forEach(c=>{const b=c.columna&&BC[c.columna];if(b){const x=d.get(c.columna);o[c.columna]=b[0]==="n"?(x===""?null:+x):((x||"").trim()||null)}});
if(!o.codigo||o.latitud==null||o.longitud==null)return toast("El código, la latitud y la longitud son obligatorios.");
const nm=prof.nombre||prof.email;if(!t||o.codigo!==t.codigo)o.responsable=nm;o.actualizado_por=nm;o.fecha_actualizacion=new Date().toISOString();

if(has("dap"))mk("c_dap","bar",[["0-10",0,10],["10-20",10,20],["20-30",20,30],["30-40",30,40],["40-60",40,60],["60+",60,1e9]].map(([l,a,b])=>[l,d.filter(t=>+t.dap>=a&&+t.dap<b).length]));
if(has("usuario"))mk("c_usuario","bar",cnt(d,DIM.usuario).slice(0,8),"usuario");
$("#vDash").onchange=e=>{const k=e.target.dataset.f;if(k){F[k]=e.target.value;viewDash()}};
$("#dclr").onclick=()=>{F={};viewDash()};
if($("#dcfg"))$("#dcfg").onclick=()=>{modal('<h2>Qué mostrar en el dashboard</h2><form id="fd">'+WD.map(([k,l])=>'<label class="ck"><input type="checkbox" value="'+k+'" '+(on.includes(k)?"checked":"")+'>'+l+'</label>').join("")+'<div class="acts"><button class="btn" type="submit">Guardar</button><button type="button" class="btn o" id="cx">Cancelar</button></div></form>');
$("#cx").onclick=closeM;$("#fd").onsubmit=async e=>{e.preventDefault();const v=[...e.target.querySelectorAll("input:checked")].map(i=>i.value),{error}=await sb.from("ajustes").upsert({clave:"dashboard",valor:{on:v}});if(error)return toast(error.message);closeM();toast("Dashboard actualizado");viewDash()}}}

/* Impacto ambiental: biomasa (Chave et al. 2014), carbono (IPCC 2006) y equivalencia con el factor de emisión del SIN (UPME) */
const EDAD="Edad estimada (años)";
const biom=(t,rho)=>{const D=+t.dap,H=+t.altura_total;return D>0&&H>0?0.0673*Math.pow(rho*D*D*H,0.976):null};
function viewImp(){
$("#vImp").innerHTML='<h2>Impacto ambiental</h2><p style="color:var(--mu)">Estimaciones calculadas con el DAP y la altura de cada árbol registrado, y con el factor de emisión del Sistema Interconectado Nacional (UPME).</p><div class="kp" id="ik"></div><div class="dg" style="margin-top:12px"><div class="card"><h3 style="font-size:16px">CO₂ almacenado por especie (t)</h3><div class="ch"><canvas id="c_ie"></canvas></div></div><div class="card"><h3 style="font-size:16px">Parámetros</h3><label for="i_rho">Densidad de la madera (g/cm³)</label><input id="i_rho" type="number" step="0.01" min="0.2" max="1.2" value="'+IM.rho+'"><label for="i_fe">Factor de emisión del SIN (tCO₂e/MWh)</label><input id="i_fe" type="number" step="0.001" min="0.01" value="'+IM.fe+'"><p style="font-size:12px;color:var(--mu)">Actualiza el factor cuando la UPME publique uno nuevo. Para mejorar la precisión usa la densidad de la madera de cada especie.</p></div></div>'
+'<details class="card"><summary>Metodología, fórmulas y fuentes</summary><div style="font-size:13px;color:var(--mu)"><p><b>1. Biomasa aérea (kg).</b> AGB = 0,0673 × (ρ × DAP² × H)^0,976, con ρ en g/cm³, DAP en cm y H en m. Ecuación pantropical de Chave et al. (2014), Global Change Biology 20: 3177–3190.</p><p><b>2. Carbono almacenado.</b> C = AGB × 0,47 (fracción de carbono por defecto, IPCC 2006, Directrices para inventarios nacionales de GEI, vol. 4).</p><p><b>3. CO₂ almacenado.</b> CO₂ = C × 44/12 (relación estequiométrica).</p><p><b>4. Oxígeno asociado.</b> O₂ = CO₂ × 32/44. Es el oxígeno liberado al formar la biomasa acumulada, no una producción anual.</p><p><b>5. Equivalente eléctrico.</b> MWh = tCO₂ ÷ FE, donde FE es el factor de emisión del SIN para inventarios de GEI: 0,220 tCO₂e/MWh (UPME, Resolución 000085 de 2026, docs.upme.gov.co/Normatividad/085_2026.pdf). Indica cuánta electricidad del SIN emite lo mismo que el CO₂ almacenado.</p><p><b>6. Captura anual promedio.</b> CO₂ ÷ edad estimada, solo para árboles con la variable “Edad estimada (años)” activa y diligenciada.</p><p><b>Limitaciones.</b> Solo biomasa aérea (sin raíces). La ecuación se calibró en bosques tropicales, por lo que en árboles urbanos es una aproximación. El valor es un inventario acumulado (stock) y no un flujo anual. La densidad por defecto (0,55) es un supuesto.</p></div></details>';
const calc=()=>{IM.rho=+$("#i_rho").value||0.55;IM.fe=+$("#i_fe").value||0.220;let agb=0,n=0,an=0,na=0;const pe={};
T.forEach(t=>{const b=biom(t,IM.rho);if(b==null)return;n++;agb+=b;const co2=b*0.47*44/12;const k=t.nombre_comun||"Sin nombre";pe[k]=(pe[k]||0)+co2/1000;const ed=+(t.datos_extra||{})[EDAD];if(ed>0){na++;an+=co2/ed}});
const tC=agb*0.47/1000,tco2=tC*44/12,o2=tco2*32/44;
$("#ik").innerHTML=kp(n+" de "+T.length,"árboles con DAP y altura")+kp(fmt(tco2)+" t","CO₂ almacenado")+kp(fmt(tC)+" t","carbono almacenado")+kp(fmt(o2)+" t","oxígeno asociado")+kp(fmt(tco2/IM.fe,0)+" MWh","equivalente eléctrico del SIN")+kp(n?fmt(tco2*1000/n,0)+" kg":"—","CO₂ promedio por árbol")+kp(na?fmt(an/1000)+" t/año":"—","captura anual promedio ("+na+" con edad)");
mk("c_ie","bar",Object.entries(pe).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>[k,+v.toFixed(2)]),null)};
$("#i_rho").onchange=calc;$("#i_fe").onchange=calc;calc()}

/* Reportes por fecha de registro */
function repRange(){if(RF.d||RF.h)return[RF.d||"0000-01-01",RF.h||"9999-12-31"];if(!RF.m)return["0000-01-01","9999-12-31"];const[y,m]=RF.m.split("-");return[RF.m+"-01",RF.m+"-"+String(new Date(y,m,0).getDate()).padStart(2,"0")]}
function viewRep(){const[a,b]=repRange(),r=T.filter(t=>{const d=(t.creado_en||"").slice(0,10);return d>=a&&d<=b}),esp=cnt(r,DIM.especie),usr=cnt(r,DIM.usuario),est=ES.map(e=>[e,r.filter(t=>t.estado_general===e).length]),dia=cnt(r,t=>(t.creado_en||"").slice(0,10)).sort((x,y)=>x[0]<y[0]?-1:1),nat=r.filter(t=>t.origen==="Nativo").length;
const dp=l=>{const x=l.filter(t=>+t.dap>0);return x.length?fmt(x.reduce((s,t)=>s+ +t.dap,0)/x.length):"—"};
$("#vRep").innerHTML='<h2>Reportes por fecha</h2><div class="card"><div class="g2"><div><label for="r_m">Mes</label><input id="r_m" type="month" value="'+RF.m+'"></div><div></div><div><label for="r_d">Desde (opcional)</label><input id="r_d" type="date" value="'+RF.d+'"></div><div><label for="r_h">Hasta (opcional)</label><input id="r_h" type="date" value="'+RF.h+'"></div></div><div class="acts"><button class="btn" id="rx">Descargar Excel</button><button class="btn b" id="rp">Descargar PDF</button></div></div>'
+'<div class="kp">'+kp(r.length,"árboles registrados")+kp(esp.length,"especies distintas")+kp(usr.length,"usuarios que registraron")+kp(r.length?Math.round(nat/r.length*100)+"%":"—","nativos")+'</div>'
+(r.length?'<div class="dg" style="margin-top:12px"><div class="card"><h3 style="font-size:16px">Registros por día</h3><div class="ch"><canvas id="r_dia"></canvas></div></div><div class="card"><h3 style="font-size:16px">Especies registradas</h3><div class="ch"><canvas id="r_esp"></canvas></div></div><div class="card"><h3 style="font-size:16px">Estado fitosanitario</h3><div class="ch"><canvas id="r_est"></canvas></div></div><div class="card"><h3 style="font-size:16px">Registros por usuario</h3><div class="ch"><canvas id="r_usr"></canvas></div></div></div>'
+'<div class="card" style="margin-top:12px;overflow:auto"><h3 style="font-size:16px">Por especie</h3>'+tbl(["Especie","Cantidad","DAP promedio (cm)"],esp.map(([k,v])=>[k,v,dp(r.filter(t=>DIM.especie(t)===k))]))+'</div><div class="card" style="overflow:auto"><h3 style="font-size:16px">Por usuario</h3>'+tbl(["Usuario","Árboles registrados"],usr)+'</div><div class="card" style="overflow:auto"><h3 style="font-size:16px">Árboles registrados ('+Math.min(r.length,200)+' de '+r.length+')</h3>'+tbl(["Código","Especie","Estado","Barrio","Registrado por","Fecha"],r.slice(0,200).map(t=>[t.codigo,t.nombre_comun,t.estado_general,t.barrio,t.responsable,(t.creado_en||"").slice(0,10)]))+'</div>':'<div class="card" style="margin-top:12px">No hay árboles registrados en este periodo.</div>');
if(r.length){mk("r_dia","bar",dia);mk("r_esp","bar",esp.slice(0,8),null);mk("r_est","doughnut",est,null,EC);mk("r_usr","bar",usr.slice(0,8),null)}
const re=()=>{RF.m=$("#r_m").value;RF.d=$("#r_d").value;RF.h=$("#r_h").value;viewRep()};$("#r_m").onchange=()=>{$("#r_d").value="";$("#r_h").value="";re()};$("#r_d").onchange=re;$("#r_h").onchange=re;
$("#rx").onclick=()=>{const wb=XLSX.utils.book_new(),add=(n,x)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(x),n);
add("Resumen",[{Periodo:a+" a "+b,"Árboles registrados":r.length,"Especies distintas":esp.length,"Usuarios":usr.length,"Nativos":nat}]);add("Especies",esp.map(([k,v])=>({Especie:k,Cantidad:v,"DAP promedio (cm)":dp(r.filter(t=>DIM.especie(t)===k))})));add("Usuarios",usr.map(([k,v])=>({Usuario:k,"Árboles registrados":v})));
add("Árboles",r.map(t=>({Código:t.codigo,Especie:t.nombre_comun,Estado:t.estado_general,Origen:t.origen,Barrio:t.barrio,"DAP (cm)":t.dap,"Altura (m)":t.altura_total,"Registrado por":t.responsable,"Fecha de registro":(t.creado_en||"").slice(0,10)})));XLSX.writeFile(wb,"informe_raiz_viva_"+a+"_a_"+b+".xlsx")};
$("#rp").onclick=()=>{const w=window.open("","_blank");if(!w)return toast("Permite las ventanas emergentes para generar el PDF.");const im=id=>CH[id]?'<img src="'+CH[id].toBase64Image()+'" style="width:48%">':"";
w.document.write('<title>Informe Raíz Viva</title><style>body{font-family:sans-serif;margin:24px;color:#12261c}h1{color:#0f4d33}table{border-collapse:collapse;width:100%;margin:8px 0 18px}td,th{border:1px solid #ccc;padding:5px;font-size:12px;text-align:left}th{background:#eef5f0}</style><h1>Raíz Viva · Informe de registros</h1><p>Periodo: '+a+' a '+b+'</p><p><b>'+r.length+'</b> árboles registrados · <b>'+esp.length+'</b> especies · <b>'+usr.length+'</b> usuarios · <b>'+nat+'</b> nativos</p>'+im("r_dia")+im("r_esp")+im("r_est")+im("r_usr")+'<h2>Por especie</h2>'+tbl(["Especie","Cantidad","DAP promedio (cm)"],esp.map(([k,v])=>[k,v,dp(r.filter(t=>DIM.especie(t)===k))]))+'<h2>Por usuario</h2>'+tbl(["Usuario","Árboles registrados"],usr)+'<h2>Árboles</h2>'+tbl(["Código","Especie","Estado","Barrio","Registrado por"],r.map(t=>[t.codigo,t.nombre_comun,t.estado_general,t.barrio,t.responsable]))+'');w.document.close();setTimeout(()=>w.print(),700)}}


/* ===== CÓDIGOS QR ===== */
const linkArbol=t=>(URL_PUBLICA||location.origin+location.pathname)+"?arbol="+encodeURIComponent(t.codigo);
function qrCanvas(t){const q=qrcode(0,"M");q.addData(linkArbol(t));q.make();const n=q.getModuleCount(),s=14,m=3*s,w=n*s+2*m,c=document.createElement("canvas");c.width=w;c.height=w+90;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#0f4d33";
for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(m+k*s,m+r*s,s,s);
x.fillStyle="#12261c";x.textAlign="center";x.font="700 34px sans-serif";x.fillText(t.codigo,w/2,w+10);x.font="24px sans-serif";x.fillText((t.nombre_comun||"")+" · Raíz Viva",w/2,w+50);return c}
function qrModal(t){modal('<h2>Código QR · '+esc(t.codigo)+'</h2><div id="qc" style="text-align:center"></div><p style="word-break:break-all;font-size:13px">'+esc(linkArbol(t))+'</p><div class="acts"><button class="btn" id="qd">Descargar PNG</button><button class="btn o" id="qk">Copiar enlace</button><button class="btn o" id="cx">Cerrar</button></div>');
const c=qrCanvas(t);c.style.maxWidth="100%";c.style.height="auto";$("#qc").appendChild(c);$("#cx").onclick=closeM;
$("#qd").onclick=()=>{const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="QR_"+t.codigo+".png";a.click()};
$("#qk").onclick=()=>navigator.clipboard.writeText(linkArbol(t)).then(()=>toast("Enlace copiado"))}
function etiquetas(){if(!T.length)return toast("No hay árboles registrados.");const w=window.open("","_blank");if(!w)return toast("Permite las ventanas emergentes para imprimir.");
w.document.write('<title>Etiquetas QR</title><style>body{font-family:sans-serif;margin:10px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.e{border:1px dashed #999;padding:6px;break-inside:avoid}img{width:100%;display:block}</style><div class="g">'+T.map(t=>'<div class="e"><img src="'+qrCanvas(t).toDataURL("image/png")+'"></div>').join("")+'</div>');w.document.close();setTimeout(()=>w.print(),600)}

/* ===== SESIÓN Y NAVEGACIÓN ===== */
function nav(){const it=[["mapa","Mapa"]];if(can("ver_dashboard"))it.push(["dashboard","Dashboard"]);if(can("ver_impacto"))it.push(["impacto","Impacto"]);if(can("ver_reportes"))it.push(["reportes","Reportes"]);if(can("gestionar_usuarios"))it.push(["usuarios","Usuarios"]);if(can("gestionar_roles"))it.push(["roles","Roles"]);if(can("gestionar_campos"))it.push(["campos","Campos"]);if(can("carga_masiva"))it.push(["carga","Carga masiva"]);
$("#nav").innerHTML=it.map(([k,l])=>'<button data-v="'+k+'" class="'+(view===k?"on":"")+'">'+l+'</button>').join("");
$("#nav").onclick=e=>{if(e.target.dataset.v)go(e.target.dataset.v)};
$("#auth").textContent=prof?"Salir · "+(prof.nombre||prof.email)+(prof.roles?" ("+prof.roles.nombre+")":""):"Ingresar";
$("#auth").onclick=prof?()=>sb.auth.signOut():login}
function go(v){view=v;$("#vMapa").classList.toggle("hide",v!=="mapa");$("#vUsr").classList.toggle("hide",v!=="usuarios");$("#vRol").classList.toggle("hide",v!=="roles");$("#vCam").classList.toggle("hide",v!=="campos");$("#vDash").classList.toggle("hide",v!=="dashboard");$("#vImp").classList.toggle("hide",v!=="impacto");$("#vRep").classList.toggle("hide",v!=="reportes");$("#vCar").classList.toggle("hide",v!=="carga");
if(v==="mapa")setTimeout(()=>map.invalidateSize(),50);if(v==="usuarios")viewUsr();if(v==="roles")viewRol();if(v==="dashboard")viewDash();if(v==="impacto")viewImp();if(v==="reportes")viewRep();if(v==="campos")viewCam();if(v==="carga")viewCar();nav()}
function login(){modal('<h2>Ingresar</h2><form id="fl"><label for="l1">Correo</label><input id="l1" name="email" type="email" required><label for="l2">Contraseña</label><input id="l2" name="pw" type="password" required><div class="acts"><button class="btn" type="submit">Entrar</button><button type="button" class="btn o" id="cx">Cancelar</button></div></form>');
$("#cx").onclick=closeM;$("#fl").onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target),{error}=await sb.auth.signInWithPassword({email:d.get("email"),password:d.get("pw")});if(error)return toast("Correo o contraseña incorrectos.");closeM()}}
async function loadProf(s){prof=null;if(s&&s.user){const {data}=await sb.from("perfiles").select("*,roles(*)").eq("id",s.user.id).single();prof=data;if(data&&!data.activo)toast("Tu cuenta aún no está activada. Pide a un administrador que la active.")}
const PV={usuarios:"gestionar_usuarios",roles:"gestionar_roles",campos:"gestionar_campos",carga:"carga_masiva",dashboard:"ver_dashboard",impacto:"ver_impacto",reportes:"ver_reportes"};if(view!=="mapa"&&!can(PV[view]))view="mapa";if(prof)await loadCampos();go(view);panel()}
sb.auth.onAuthStateChange((_e,s)=>{setTimeout(()=>loadProf(s),0)});
loadTrees();nav();
</script>
